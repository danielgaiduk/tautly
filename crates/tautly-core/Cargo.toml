[package]
name = "tautly-core"
description = "Tautly engine: the turn loop, approvals, configuration, authentication and the client protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
tautly-provider = { path = "../tautly-provider" }
tautly-sandbox = { path = "../tautly-sandbox" }
tautly-tools = { path = "../tautly-tools" }
tautly-context = { path = "../tautly-context" }
tautly-memory = { path = "../tautly-memory" }
tautly-index = { path = "../tautly-index" }
tautly-session = { path = "../tautly-session" }
tautly-mcp = { path = "../tautly-mcp" }
async-trait.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-util.workspace = true
futures.workspace = true
blake3.workspace = true
globset.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
url = { workspace = true, features = ["serde"] }
thiserror.workspace = true
libc.workspace = true
rusqlite.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["linux-native-async-persistent", "crypto-rust"] }

[dev-dependencies]
insta.workspace = true
ignore.workspace = true
proptest.workspace = true
wiremock.workspace = true
# A paused clock for the playback pacing test.
tokio = { workspace = true, features = ["test-util"] }
