[package]
name = "tautly-core"
description = "Tautly engine: configuration, authentication and the client protocol (events and commands)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tautly-provider = { path = "../tautly-provider" }
tautly-sandbox = { path = "../tautly-sandbox" }
tautly-tools = { path = "../tautly-tools" }
tautly-context = { path = "../tautly-context" }
tautly-memory = { path = "../tautly-memory" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
url = { workspace = true, features = ["serde"] }
thiserror.workspace = true
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["linux-native-async-persistent", "crypto-rust"] }

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
blake3.workspace = true
