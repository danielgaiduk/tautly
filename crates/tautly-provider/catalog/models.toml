# Built-in model catalog. Prices are USD per million tokens.
# NOTE: windows and prices below are best-effort estimates and MUST be verified
# against the providers' pricing pages before release. Anthropic entries: per the
# Claude API reference (2026-10); cache_write is the 5-minute TTL rate (1.25x input).
# Haiku 5.5 prices are its prompt <= 100K tokens card ($0.50 / $2.50 above).
# `reasoning = "effort_always"`: thinking cannot be turned off, so "off" sends the
# lowest effort. `thinking_budget_max` (Gemini): the largest thinking budget sent;
# Gemini 3's ranges are unverified (the 2.5 Pro / Flash documented maxima).

[models."anthropic/claude-sonnet-5-5"]
context_window = 1000000
max_output = 128000
parallel_tools = true
reasoning = "effort_always"
cache = "explicit"
images = true
edit_format = "str_replace"
[models."anthropic/claude-sonnet-5-5".price]
input = 2.0
output = 10.0
cache_read = 0.2
cache_write = 2.5

