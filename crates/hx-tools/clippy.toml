# All file and process access must go through hx_sandbox::Sandbox.
disallowed-methods = [
    "std::fs::read",
    "std::fs::write",
    "std::fs::read_to_string",
    "std::fs::read_dir",
    "std::fs::remove_file",
    "std::fs::remove_dir_all",
    "std::fs::create_dir_all",
    "std::fs::copy",
    "std::fs::rename",
    "std::fs::metadata",
    "std::fs::File::open",
    "std::fs::File::create",
    "std::fs::OpenOptions::new",
    "tokio::fs::read",
    "tokio::fs::write",
    "tokio::fs::read_dir",
    "tokio::fs::remove_file",
    "tokio::fs::create_dir_all",
    "tokio::fs::metadata",
    "tokio::fs::File::open",
    "tokio::fs::File::create",
    "tokio::fs::OpenOptions::new",
]
disallowed-types = [
    "std::process::Command",
    "tokio::process::Command",
    "tokio::fs::File",
    "tokio::fs::OpenOptions",
    "std::fs::OpenOptions",
]
