[package]
name = "tautly-cli"
description = "The `tautly` command: one-shot (`-p`) and JSON-RPC (`--rpc`) modes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "tautly"
path = "src/main.rs"

[features]
# `--mock-script FILE`: a scripted provider instead of a real one (golden and perf tests).
mock = ["dep:tautly-provider"]

[dependencies]
tautly-core = { path = "../tautly-core" }
tautly-rpc = { path = "../tautly-rpc" }
tautly-provider = { path = "../tautly-provider", optional = true }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true

[[test]]
name = "mock_cli"
required-features = ["mock"]
