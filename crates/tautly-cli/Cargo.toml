[package]
name = "tautly-cli"
description = "The `tautly` command: one-shot (`-p`) and JSON-RPC (`--rpc`) modes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "tautly"
path = "src/main.rs"

[features]
# `--mock-script FILE`: a scripted provider instead of a real one (golden and perf tests).
mock = ["dep:tautly-provider"]

[dependencies]
tautly-core = { path = "../tautly-core" }
tautly-rpc = { path = "../tautly-rpc" }
tautly-provider = { path = "../tautly-provider", optional = true }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "signal"] }

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true

[[test]]
name = "mock_cli"
required-features = ["mock"]

# `cargo binstall tautly-cli` downloads the cargo-dist archive of the host (or the nearest musl)
# target from the GitHub release instead of building (spec 7.11.3). The names match what
# `dist plan` produces (`tautly-cli-<target>.tar.xz`, binary at the archive's
# `tautly-cli-<target>/tautly`); scripts/check-dist-plan.sh keeps the two in step.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"
