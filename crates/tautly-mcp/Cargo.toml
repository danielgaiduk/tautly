[package]
name = "tautly-mcp"
description = "Tools-only Model Context Protocol client for Tautly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tautly-tools = { path = "../tautly-tools" }
tautly-sandbox = { path = "../tautly-sandbox" }
tautly-provider = { path = "../tautly-provider" }
# TLS without a built-in crypto provider: the HTTP client is built here with rustls on
# `ring`, the provider the rest of the workspace already uses (no aws-lc).
rmcp = { workspace = true, features = [
    "client",
    "transport-async-rw",
    "transport-streamable-http-client-reqwest",
    "reqwest-tls-no-provider",
] }
reqwest013 = { workspace = true, features = ["rustls-no-provider"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
webpki-roots.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-util.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
libc.workspace = true
url = { workspace = true, features = ["serde"] }
toml_edit.workspace = true
http.workspace = true
tempfile.workspace = true

[dev-dependencies]
tokio.workspace = true
toml.workspace = true
