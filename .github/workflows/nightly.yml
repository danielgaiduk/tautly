name: nightly
permissions:
  contents: read
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
# One live run at a time; a late run waits rather than cancelling one already spending.
concurrency:
  group: nightly
  cancel-in-progress: false
# GitHub disables scheduled workflows after 60 days without repository activity
# (docs/benchmark.md, "Live smoke").
jobs:
  # The ignored live smoke tests (crates/tautly-cli/tests/live_smoke.rs) against real
  # providers. TAUTLY_LIVE_REQUIRE=1: a cloud provider whose secret is missing or empty
  # fails the run instead of skipping, so the nightly cannot go green having tested
  # nothing. Ollama is never on the runner, so its test always skips.
  #
  # This job holds the secrets: every action is pinned to a commit, checkout keeps no
  # credentials, and there is no shared cache to read from or write to.
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Build first, without the keys in the environment.
      - run: cargo test -p tautly --features mock --test live_smoke --no-run
      # `mock` makes TAUTLY_TEST_SECRET_STORE effective, so the binary never opens a keychain.
      - run: cargo test -p tautly --features mock --test live_smoke -- --ignored --nocapture
        env:
          TAUTLY_LIVE_REQUIRE: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
