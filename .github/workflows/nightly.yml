name: nightly
permissions:
  contents: read
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
jobs:
  # The ignored live smoke tests (crates/tautly-cli/tests/live_smoke.rs) against real
  # providers. A provider whose secret is not set gets an empty variable, and its tests print
  # SKIPPED and pass. Ollama is never present on the runner, so its test always skips.
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Build first, without the keys in the environment.
      - run: cargo test -p tautly --features mock --test live_smoke --no-run
      # `mock` makes TAUTLY_TEST_SECRET_STORE effective, so the binary never opens a keychain.
      - run: cargo test -p tautly --features mock --test live_smoke -- --ignored --nocapture
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # The benchmark kit's scripts only: no live benchmark run in CI.
  benchmark-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck benchmarks/terminal-bench/*.sh
      - run: python3 -m doctest benchmarks/terminal-bench/tautly_usage.py
