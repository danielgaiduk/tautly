name: nightly
permissions:
  contents: read
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
# One live run at a time; a late run waits rather than cancelling one already spending.
concurrency:
  group: nightly
  cancel-in-progress: false
# GitHub disables scheduled workflows after 60 days without repository activity
# (docs/benchmark.md, "Live smoke").
jobs:
  # The ignored live smoke tests (crates/tautly-cli/tests/live_smoke.rs) against real
  # providers. TAUTLY_LIVE_REQUIRE=1: a cloud provider whose secret is missing or empty
  # fails the run instead of skipping, so the nightly cannot go green having tested
  # nothing. Ollama is never on the runner, so its test always skips.
  #
  # This job holds the secrets: every action is pinned to a commit, checkout keeps no
  # credentials, and there is no shared cache to read from or write to.
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Build first, without the keys in the environment.
      - run: cargo test -p tautly --features mock --test live_smoke --no-run
      # `mock` makes TAUTLY_TEST_SECRET_STORE effective, so the binary never opens a keychain.
      - run: cargo test -p tautly --features mock --test live_smoke -- --ignored --nocapture
        env:
          TAUTLY_LIVE_REQUIRE: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # A 60 s smoke run of every fuzz target (fuzz/README.md), on the nightly toolchain
  # libFuzzer needs; the workspace itself stays on stable. No secrets here: nothing in
  # this job reads one, and checkout keeps no credentials.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly
      - run: cargo install --locked cargo-fuzz --version 0.13.2
      - run: cargo +nightly fuzz build
        working-directory: fuzz
      - name: Run each target for 60 s
        working-directory: fuzz
        run: |
          for t in $(cargo +nightly fuzz list); do
            max_len=4096
            if [ "$t" = mcp_launch ]; then max_len=65536; fi
            mkdir -p "$RUNNER_TEMP/corpus/$t"
            cargo +nightly fuzz run "$t" "$RUNNER_TEMP/corpus/$t" "corpus/$t" -- \
              -max_total_time=60 -timeout=10 -rss_limit_mb=2048 -max_len="$max_len"
          done
