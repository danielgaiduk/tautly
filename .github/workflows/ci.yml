name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # The `tautly` binary end to end on a scripted provider (`--mock-script`).
      - run: cargo test -p tautly-cli --features mock
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p tautly-cli --all-targets --features mock -- -D warnings
