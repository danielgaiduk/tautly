name: ci
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # The workspace's debug build with full debug info filled the Linux runner's disk.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # One run, with the `tautly` binary's scripted provider (`--mock-script`) on, so its
      # end-to-end tests run too without building the workspace a second time.
      - run: cargo test --workspace --features tautly/mock
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p tautly --all-targets --features mock -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Advisories, licences, duplicate/wildcard bans and sources (deny.toml). The tool version is
  # pinned; the advisory database is fetched fresh on every run.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check

  # Performance gates (spec 9.1), release build on both OSes: cold start and idle
  # RSS (benches/perf/startup.sh, relative to the merge-base's binary), then the in-process
  # gates in benches/perf/ (crate tautly-perf, all `#[ignore]`, one at a time so timings and
  # RSS are not shared). Each measurement is also written to the job summary. Then the token
  # regression gate on the same release binary: the scripted starter sessions
  # (evals/replay, mock provider, no scripted usage, so the engine's own request estimates
  # count) must all pass and stay within 10% of evals/baseline.json in tokens per solved
  # task. On Linux, the benchmark kit's report generator runs on its committed fixture and
  # its script is syntax-checked; live benchmark runs (benchmarks/tokens/run.sh) are manual.
  perf:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install hyperfine
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install hyperfine
          else sudo apt-get update && sudo apt-get install -y hyperfine; fi
      - name: Merge base
        id: base
        run: echo "sha=$(git merge-base HEAD origin/${{ github.base_ref || 'main' }})" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: baseline
        with:
          path: baseline/tautly
          key: tautly-baseline-${{ runner.os }}-${{ steps.base.outputs.sha }}
      - name: Build the merge-base binary
        if: steps.baseline.outputs.cache-hit != 'true'
        run: |
          git worktree add ../base "${{ steps.base.outputs.sha }}"
          if (cd ../base && cargo build --release -p tautly --features mock); then
            mkdir -p baseline && cp ../base/target/release/tautly baseline/tautly
          else
            echo "::warning::the merge-base binary did not build; the relative start-up gate is skipped"
          fi
      # One feature selection for the build and the gates, so nothing is built twice.
      - run: cargo test --release -p tautly -p tautly-perf --features tautly/mock --no-run
      - run: bash benches/perf/startup.sh
        env:
          TAUTLY_BASELINE_BIN: baseline/tautly
      - run: cargo test --release -p tautly -p tautly-perf --features tautly/mock -- --ignored --test-threads=1 --nocapture
        env:
          # glibc's per-thread malloc arenas keep freed memory resident (soak RSS +10%, ACP
          # load +155 MB uncapped), which the RSS gates are not about; release binaries for
          # Linux use musl. acp_load still reports the uncapped figure.
          MALLOC_ARENA_MAX: "2"
      # Built by the test build above (the binary the integration tests run).
      - run: ./target/release/tautly eval --replay evals/replay --jobs 4
      - if: runner.os == 'Linux'
        run: ./target/release/tautly eval report benchmarks/tokens/fixtures/sample.json --markdown
      - if: runner.os == 'Linux'
        run: bash -n benchmarks/tokens/run.sh

  # Every starter task must fail before it is solved, with all four toolchains present
  # (a missing `go` or an old Node would make a task fail for the wrong reason).
  eval-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - run: go version && node --version && python3 --version
      - name: verify fails on every unmodified setup
        run: |
          set -u
          fail=0
          for d in evals/starter/*/; do
            dir=$(mktemp -d)
            if ! (cd "$dir" && bash "$GITHUB_WORKSPACE/$d/setup.sh" >/dev/null); then
              echo "setup failed: $d"; fail=1; continue
            fi
            if (cd "$dir" && bash "$GITHUB_WORKSPACE/$d/verify.sh" >/dev/null 2>&1); then
              echo "verify passes before solving: $d"; fail=1
            fi
            rm -rf "$dir"
          done
          exit $fail

  # The benchmark kit's scripts only (benchmarks/terminal-bench): no live benchmark run in CI.
  benchmark-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck benchmarks/terminal-bench/*.sh
      - run: python3 -I -m doctest benchmarks/terminal-bench/tautly_usage.py

  # Hooks declared in configuration (`hook.<name>.command`/`event`) arrived in git 2.54, and
  # `core.hooksPath=/dev/null` does not switch them off, so checkpoint git disables each one it
  # finds (CP5 review C1). Runner images may ship an older git, on which the regression tests
  # skip themselves. This job installs a current git from the git-core PPA and sets
  # TAUTLY_REQUIRE_CONFIG_HOOKS, which turns that skip into a failure, so the hardening tests
  # really exercise config-based hooks somewhere.
  config-hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo add-apt-repository -y ppa:git-core/ppa && sudo apt-get update && sudo apt-get install -y git
      - run: git --version
      - run: cargo test -p tautly-core --test checkpoint --test worktree_fork --test bisect
        env:
          TAUTLY_REQUIRE_CONFIG_HOOKS: "1"

  # The release plan (cargo-dist) matches spec 7.11.3: four targets, shell + Homebrew installers,
  # sha256 checksums, binstall names, release.yml in sync with dist-workspace.toml.
  dist-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Keep the version in step with `cargo-dist-version` in dist-workspace.toml.
      - run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.34.0/cargo-dist-installer.sh | sh
      - run: bash scripts/check-dist-plan.sh

  # The Linux release binary is static: the keychain backend (keyring's pure-Rust Secret Service)
  # must link on musl. If this job cannot be made green, the release falls back to the -gnu
  # targets (see the comment in dist-workspace.toml). Only x86_64 is built here; the aarch64 musl
  # target is first built by the release workflow.
  musl-static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl -p tautly
      # Newer `file` reports a static-pie executable as "static-pie linked".
      - run: file target/x86_64-unknown-linux-musl/release/tautly | grep -Eq 'statically linked|static-pie linked'
      - run: ./target/x86_64-unknown-linux-musl/release/tautly --version
      # Second proof: no dynamic loader dependencies (glibc ldd says one of these two).
      - run: ldd target/x86_64-unknown-linux-musl/release/tautly 2>&1 | grep -Eq 'not a dynamic executable|statically linked'
