[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "time", "sync"] }
ignore = "0.4"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tempfile = "3"
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
toml = "0.8"
futures = "0.3"
tokio-util = "0.7"
rand = "0.9"
async-stream = "0.3"
bytes = "1"
humantime = "2"
wiremock = "0.6"
blake3 = "1"
