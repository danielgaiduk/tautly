[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
version = "0.1.0"
# TODO(release): replace OWNER with the GitHub account or organisation that hosts the
# repository (see docs/release.md). cargo-dist derives the release URLs, the installer's
# download base and the Homebrew tap owner from this URL.
repository = "https://github.com/OWNER/tautly"
homepage = "https://github.com/OWNER/tautly"

[workspace.dependencies]
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "time", "sync"] }
ignore = "0.4"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tempfile = "3"
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
toml = "0.8"
futures = "0.3"
tokio-util = "0.7"
rand = "0.9"
async-stream = "0.3"
bytes = "1"
humantime = "2"
wiremock = "0.6"
blake3 = "1"
regex = "1"
libc = "0.2"
similar = "2"
proptest = "1"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
htmd = "0.5"
rusqlite = { version = "0.37", features = ["bundled"] }
rayon = "1"
streaming-iterator = "0.1"
notify = "8"
regex-syntax = "0.8"
ulid = "1"
keyring = { version = "3.6", default-features = false }
insta = { version = "1", features = ["json"] }
rmcp = { version = "3.8", default-features = false }
toml_edit = "0.22"
http = "1"
hyper = "1"
hyper-util = "0.1"
tower-service = "0.3"
# The reqwest rmcp uses (0.13); the rest of the workspace is on 0.12.
reqwest013 = { package = "reqwest", version = "0.13.2", default-features = false }
rustls = { version = "0.23", default-features = false }
webpki-roots = "1"
# The `tautly` binary: argument parsing and errors (anyhow only in tautly-cli).
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
# YAML frontmatter of memory entries: panic-free parser with input budgets (hostile repos).
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize"] }

# Release builds made by cargo-dist (`dist build`); see dist-workspace.toml.
[profile.dist]
inherits = "release"
