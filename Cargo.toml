[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "time", "sync"] }
ignore = "0.4"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tempfile = "3"
